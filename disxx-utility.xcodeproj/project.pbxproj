				"#!/usr/bin/ruby",
				"",
				"require \"shellwords\"",
				"require \"open3\"",
				"",
				"if __FILE__ == $0",
				"    Dir.mkdir(\"#{ENV[\"DERIVED_FILE_DIR\"]}/precompiled/\") if !Dir.exists? \"#{ENV[\"DERIVED_FILE_DIR\"]}/precompiled/\"",
				"    Dir.mkdir(ENV[\"OBJROOT\"]) if !Dir.exists? ENV[\"OBJROOT\"]",
				"",
				"    if ENV[\"ARCHS\"] == \"arm64\"",
				"        _, stderr, status = Open3.capture3(",
				"            \"xcrun\", \"as\",",
				"            \"-c\", ENV[\"SCRIPT_INPUT_FILE_1\"],",
				"            \"-o\", \"#{ENV[\"OBJROOT\"]}/#{File.basename(ENV[\"SCRIPT_INPUT_FILE_1\"]).gsub /\\.s$/, \".o\"}\"",
				"        )",
				"            ",
				"        warn stderr",
				"            ",
				"        exit status.exitstatus if !status.success?",
				"    else",
				"        _, stderr, status = Open3.capture3(",
				"            \"xcrun\", \"clang\",",
				"            *Shellwords.shellsplit(ENV[\"OTHER_CFLAGS\"] || \"\"),",
				"            \"-c\", ENV[\"SCRIPT_INPUT_FILE_2\"],",
				"            \"-o\", \"#{ENV[\"OBJROOT\"]}/#{File.basename(ENV[\"SCRIPT_INPUT_FILE_2\"]).gsub /\\.c$/, \".o\"}\"",
				"        )",
				"            ",
				"        warn stderr",
				"            ",
				"        exit status.exitstatus if !status.success?",
				"    end",
				"",
				"    File.open(ENV[\"SCRIPT_INPUT_FILE_LIST_0\"]) do |file|",
				"        file.readlines.each do |src|",
				"            src = src.gsub /\\n$/, ''",
				"            ",
				"            next if src.empty?",
				"  ",
				"            _, stderr, status = Open3.capture3(",
				"                \"xcrun\", \"clang++\",",
				"                *Shellwords.shellsplit(ENV[\"OTHER_CPLUSPLUSFLAGS\"] || \"\"),",
				"                \"-std=#{ENV[\"CLANG_CXX_LANGUAGE_STANDARD\"]}\",",
				"                \"-fmodule-output=#{ENV[\"DERIVED_FILE_DIR\"]}/precompiled/#{File.basename(src.gsub /\\.cppm$/, \".pcm\")}\",",
				"                \"-c\", src,",
				"                \"-o\", \"#{ENV[\"OBJROOT\"]}/#{File.basename(src).gsub /\\.cppm$/, \"-mod.o\"}\"",
				"            )",
				"            ",
				"            warn stderr",
				"            ",
				"            exit status.exitstatus if !status.success?",
				"        end",
				"    end",
				"    ",
				"    File.open(ENV[\"SCRIPT_OUTPUT_FILE_LIST_0\"]) do |file|",
				"        ENV[\"ARCHS\"].split ' ' do |arch|",
				"            File.open(ENV[\"LINK_FILE_LIST_normal_#{arch}\"], 'a') do |list|",
				"                file.readlines.each do |obj|",
				"                    list.write obj",
				"                end",
				"            end",
				"        end",
				"    end",
				"end",
				"",
			);
		};
